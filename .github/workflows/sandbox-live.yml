name: Sandbox live tests

# Runs each sandbox provider's live tier against the provider's real service. Every test
# starts a billed sandbox, so callers choose which providers run:
#
# - `main.yml` passes the providers `scripts/sandbox_live_changes.py` selected for a pull
#   request or push, and `all` on a release tag.
# - `sandbox-live-nightly.yml` passes `all` on a schedule, and whatever a maintainer picks on
#   a manual run.
#
# A provider follows the layout described in `scripts/sandbox_live_changes.py`, so this file
# has no per-provider step. Adding a provider adds its secret below and in the two callers.
#
# There is deliberately no `ref` input: a scheduled or manual caller runs with the cache of
# the branch it started from (usually `main`), and checking out another ref there would run
# untrusted code that can write to that cache.

on:
  workflow_call:
    inputs:
      providers:
        description: 'JSON list of provider names, or `all` for every provider in the tree.'
        type: string
        required: true
    secrets:
      MODAL_TOKEN_ID:
        required: false
      MODAL_TOKEN_SECRET:
        required: false
      E2B_API_KEY:
        required: false
      SPRITE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan sandbox live tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Resolves `all`, and rejects a name that is not a provider in this tree, so the
      # matrix below only ever sees names the script knows.
      - id: plan
        env:
          REQUESTED: ${{ inputs.providers }}
        run: |
          present="$(python3 scripts/sandbox_live_changes.py all)"
          providers="$(REQUESTED="$REQUESTED" PRESENT="$present" python3 -c '
          import json, os, sys
          present = json.loads(os.environ["PRESENT"])
          requested = os.environ["REQUESTED"]
          providers = present if requested == "all" else json.loads(requested)
          unknown = [name for name in providers if name not in present]
          if unknown or not providers:
              sys.exit(f"No live tier to run for {requested!r}; providers in this tree: {present}")
          print(json.dumps(providers))
          ')"
          echo "providers=${providers}" >> "$GITHUB_OUTPUT"

  live:
    needs: [plan]
    name: ${{ matrix.provider }} live tests
    runs-on: ubuntu-latest
    # Sandbox creation goes through each provider's control plane; bound a wedged run.
    timeout-minutes: 15
    strategy:
      # One provider's outage must not cancel the others' results.
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: sandbox-${{ matrix.provider }}

      - run: uv sync --locked --group dev --extra "$PROVIDER"
        env:
          PROVIDER: ${{ matrix.provider }}

      # `<NAME>_REQUIRE_LIVE` turns a missing or empty secret into a failure; without it the
      # live tests skip themselves and the job would report green having tested nothing.
      - run: |
          upper="$(printf %s "$PROVIDER" | tr '[:lower:]' '[:upper:]')"
          export "PYDANTIC_AI_HARNESS_${upper}_LIVE=1" "${upper}_REQUIRE_LIVE=1"
          paths=("tests/${PROVIDER}_sandbox")
          # The E2B search smoke test lives with FileSystem, not with the provider tests.
          if [ "$PROVIDER" = e2b ]; then paths+=(tests/filesystem/test_search_live.py); fi
          uv run --no-sync pytest -p no:cacheprovider -m "${PROVIDER}_live" "${paths[@]}" -q
        env:
          PROVIDER: ${{ matrix.provider }}
          # Scoped to this step so checkout and setup never see the secrets.
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }} # zizmor: ignore[secrets-outside-env]
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }} # zizmor: ignore[secrets-outside-env]
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }} # zizmor: ignore[secrets-outside-env]
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }} # zizmor: ignore[secrets-outside-env]
