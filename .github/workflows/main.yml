name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request: {}

# UV_LOCKED (not UV_FROZEN): both keep uv from rewriting the lockfile, but
# frozen installs the lock blindly while locked validates it against
# pyproject.toml first and fails the job on drift. Frozen also turns
# resolution flags into silent no-ops, which left the lowest-versions job
# testing the locked (latest) versions for months. Jobs that intentionally
# deviate from the lock opt out per step with `UV_LOCKED: '0'` or `env -u`.
env:
  UV_LOCKED: '1'

permissions:
  contents: read

jobs:
  # Detect whether a pull request or branch push touches a capability whose live
  # integration job is too heavy to run on every PR. Each such capability gets its
  # own detect step and its own output; tag pushes skip detection entirely so
  # releases always exercise the live paths.
  #
  # The LocalStack job installs the AWS CLI, pulls the LocalStack image, and starts
  # a real container against an external auth token. The MongoDB job starts a
  # mongod service container and moves tens of megabytes through it.
  changes:
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      localstack: ${{ steps.detect.outputs.localstack }}
      mongodb: ${{ steps.detect-mongodb.outputs.mongodb }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pydantic_ai_harness/localstack \
            tests/localstack \
            integration_tests/localstack \
            Makefile \
            pyproject.toml \
            uv.lock \
            .github/workflows/main.yml
          then
            echo 'localstack=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo 'localstack=true' >> "$GITHUB_OUTPUT"
          fi

      # A second step rather than extra paths on `detect`: the LocalStack step's
      # exact lines are asserted by tests/localstack/test_ci_workflow.py, and the
      # two capabilities need independent answers anyway.
      - id: detect-mongodb
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pydantic_ai_harness/step_persistence \
            pydantic_ai_harness/media \
            tests/step_persistence \
            tests/media \
            integration_tests/mongodb \
            Makefile \
            pyproject.toml \
            uv.lock \
            .github/workflows/main.yml
          then
            echo 'mongodb=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo 'mongodb=true' >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: lint

      - run: uv sync --locked --all-groups --all-extras

      - uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # v3.0.0
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch

      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        install:
          - name: slim
            extras: ''
          - name: all-extras
            extras: '--all-extras'
    name: test on ${{ matrix.python-version }} (${{ matrix.install.name }})
    env:
      COVERAGE_FILE: coverage-data/.coverage.${{ matrix.python-version }}-${{ matrix.install.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: uv sync --locked --group dev ${{ matrix.install.extras }}
      - run: mkdir -p coverage-data
      - run: uv run coverage run -m pytest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.install.name }}
          path: coverage-data/.coverage.*
          include-hidden-files: true

  # Verify the harness still works against the lowest direct-dep versions we claim
  # compatibility with (the `>=` floors in pyproject.toml — including pydantic-ai-slim
  # but also any other direct dep). The default `test` matrix above resolves against
  # the lock (= latest published satisfying our constraints); this job exercises the
  # entire claimed compatibility envelope. Mirrors pydantic-ai's `test-lowest-versions`
  # job so the convention is consistent across the workspace.
  #
  # Bleeding-edge compat with pydantic-ai's main branch is verified by pydantic-ai's
  # `harness compat` job (see https://github.com/pydantic/pydantic-ai/blob/main/.github/workflows/harness-compat.yml).
  test-floor:
    runs-on: ubuntu-latest
    name: test on ${{ matrix.python-version }} (lowest-versions)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: floor

      # The lock validation must be off here: this job deviates from the lock
      # on purpose, and under UV_LOCKED=1 the lowest-direct resolution fails
      # because uv refuses to write the lowest-resolved lockfile it produces.
      - run: uv sync --resolution lowest-direct --group dev --all-extras
        env:
          UV_LOCKED: '0'
      - run: uv run --no-sync pytest

  # Verify the harness works against the latest published pydantic-ai packages,
  # not just the lock. The `test` matrix resolves against the lock, so harness
  # code merged after the last lock refresh is never exercised against newer
  # pydantic-ai releases until someone bumps. pydantic-ai's `harness compat`
  # job doesn't cover that window either: it tests harness main as it exists
  # when a pydantic-ai PR merges, not harness code added afterwards. With this
  # job, the pydantic-ai-slim `>=` floor in pyproject.toml can stay an honest,
  # test-verified floor (exercised by `test-floor`) instead of chasing the
  # latest release.
  test-latest:
    runs-on: ubuntu-latest
    name: test on latest pydantic-ai
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: latest

      # `env -u`: under the workflow-level `UV_LOCKED=1`, `uv lock` asserts the
      # lockfile is up to date instead of applying the upgrade, so the moment a
      # newer pydantic-ai exists this step would fail rather than test it.
      - run: |
          env -u UV_LOCKED uv lock \
            --upgrade-package pydantic-ai-slim \
            --upgrade-package pydantic-graph
      - run: uv sync --locked --group dev --all-extras
      - run: uv run --no-sync pytest

  # Guard the pymongo-free import path. The `test` matrix's slim job installs the
  # `dev` group, which carries `mongomock-motor` -- and that pulls Motor/PyMongo
  # in transitively, so even "slim" has pymongo present. This job installs the
  # base package alone (no groups, no extras), so a capability that imports
  # pymongo at module top instead of behind the lazy `__getattr__` fails here.
  base-import:
    runs-on: ubuntu-latest
    name: base install imports without extras
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: base-import

      - run: uv sync --locked --no-default-groups

      # `find_spec` assertion keeps the smoke test honest: if a base dependency
      # ever pulls pymongo back in, this fails loudly rather than passing while
      # testing nothing.
      - run: >
          uv run --no-sync python -c "import importlib.util;
          assert importlib.util.find_spec('pymongo') is None, 'base install must not have pymongo, or this smoke test no longer guards the lazy-import path';
          import pydantic_ai_harness;
          import pydantic_ai_harness.step_persistence;
          import pydantic_ai_harness.media"

  localstack-integration:
    needs: [changes]
    # Skip on pull requests and branch pushes that leave LocalStack untouched;
    # always run on tags so releases exercise the live path. `always()` lets this
    # evaluate even though `changes` is skipped on tag events.
    #
    # Also skip on pull requests that cannot read repository secrets, which is where
    # LOCALSTACK_AUTH_TOKEN comes from. LOCALSTACK_REQUIRE_AUTH_TOKEN turns an empty
    # token into a failure rather than a skip, and `check` allows this job to be
    # skipped but not to fail -- so without this guard such a pull request is red for
    # a reason unrelated to its changes. Two cases qualify:
    #
    #   - cross-repository (fork) branches, which never receive repository secrets
    #   - Dependabot-triggered runs, which read a separate secrets store; their
    #     branches live in this repo, so the head-repo check alone lets them through
    #
    # Both touch pyproject.toml or uv.lock routinely, which is what trips the path
    # filter in `changes`. Keying on github.actor rather than the branch name is
    # deliberate: it tracks who triggered the run, so a maintainer pushing to a
    # Dependabot branch regains secrets and the job runs. Either way the live
    # LocalStack run happens once the change reaches main.
    if: >-
      ${{ always()
          && (github.ref_type == 'tag' || needs.changes.outputs.localstack == 'true')
          && (github.event_name != 'pull_request'
              || (github.event.pull_request.head.repo.full_name == github.repository
                  && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    name: LocalStack integration tests
    env:
      # LOCALSTACK_REQUIRE_AUTH_TOKEN makes a missing token fail the job instead
      # of silently skipping the container tests. The token itself is scoped to
      # the test step below so checkout/setup steps never see the secret.
      LOCALSTACK_REQUIRE_AUTH_TOKEN: '1'
      LOCALSTACK_AWS_CLI: aws
      LOCALSTACK_IMAGE: localstack/localstack
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: localstack

      - run: uv sync --locked --group dev --all-extras

      - uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          install-awslocal: 'true'
          skip-startup: 'true'

      - run: aws --version

      - run: make integration-localstack
        env:
          # Since LocalStack 2026.03.0 the single image requires an auth token to start.
          # The job executes the full PR checkout, so path detection is not a security boundary.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

  mongodb-integration:
    needs: [changes]
    # Same path scoping as `localstack-integration`: run on tags so releases
    # exercise the live path, otherwise only when the change touches the Mongo
    # backends. `always()` lets this evaluate even though `changes` is skipped on
    # tag events.
    #
    # Deliberately no fork clause here, unlike `localstack-integration`. That
    # job's extra condition exists because LOCALSTACK_AUTH_TOKEN is a repository
    # secret and LOCALSTACK_REQUIRE_AUTH_TOKEN turns its absence into a failure,
    # so a run that cannot read secrets would go red for reasons unrelated to its
    # changes. It guards a secret, not a trust boundary. The mongod service below
    # starts with authentication disabled and this job reads no secret, so an
    # external contributor's pull request gets the same signal a maintainer
    # branch does. Do not copy the LocalStack condition here.
    if: >-
      ${{ always()
          && (github.ref_type == 'tag' || needs.changes.outputs.mongodb == 'true') }}
    runs-on: ubuntu-latest
    name: MongoDB integration tests
    # `localstack-integration` has no timeout because the capability owns its
    # container and enforces its own startup timeout. Nothing here does: if the
    # service container never becomes reachable the job would otherwise sit on a
    # runner for the six-hour default.
    timeout-minutes: 15
    # A `services:` container, where `localstack-integration` starts nothing.
    # That difference follows the capabilities: `localstack` ships a
    # `LocalStackContainer` class whose lifecycle is part of its public surface,
    # so its live tests drive Docker themselves. The Mongo backends take a
    # connection URL and own no container, so there is nothing for the tests to
    # start and the runner provides mongod instead.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this an unreachable server is a skip, which is what a developer
      # without a local mongod wants and exactly what must not happen here: a
      # service container that never came up would report green having tested
      # nothing.
      MONGODB_REQUIRE_LIVE: '1'
      MONGODB_TEST_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-suffix: mongodb

      - run: uv sync --locked --group dev --extra mongodb

      - run: make integration-mongodb

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true

      - run: uv sync --locked --group dev --all-extras
      - run: uv run coverage combine coverage-data
      - run: uv run coverage report

  check:
    if: always()
    needs: [changes, lint, test, test-floor, test-latest, base-import, coverage, localstack-integration, mongodb-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # localstack-integration is skipped when a pull request or branch push
          # doesn't touch LocalStack, when the pull request comes from a fork
          # (no secrets there), and `changes` is skipped on tag events.
          # mongodb-integration is skipped only on the path filter -- it needs no
          # secret, so it runs on fork pull requests too.
          # All three still vote (block the merge) when they actually run and fail.
          allowed-skips: changes, localstack-integration, mongodb-integration
          jobs: ${{ toJSON(needs) }}

  release:
    needs: [check]
    # `changes` is skipped on tag pushes, and GitHub skips every downstream job
    # of a skipped ancestor unless the condition opts out via `always()` /
    # `!cancelled()` -- which silently skipped the publish for v0.10.0 even
    # though `check` itself passed. `!cancelled()` restores evaluation without
    # publishing from a cancelled run (same opt-out `localstack-integration`
    # needs, one job up).
    if: ${{ !cancelled() && needs.check.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.14'
          enable-cache: false

      - run: uv build
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  send-tweet:
    name: Send tweet
    needs: [release]
    # Same skipped-ancestor opt-out as `release` above.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install tweepy==4.14.0
      - name: Send tweet
        shell: python
        run: |
          import os
          import tweepy

          client = tweepy.Client(
              access_token=os.getenv("TWITTER_ACCESS_TOKEN"),
              access_token_secret=os.getenv("TWITTER_ACCESS_TOKEN_SECRET"),
              consumer_key=os.getenv("TWITTER_CONSUMER_KEY"),
              consumer_secret=os.getenv("TWITTER_CONSUMER_SECRET"),
          )
          version = os.getenv("VERSION")
          tweet = os.getenv("TWEET").format(version=version)
          client.create_tweet(text=tweet)
        env:
          # The tag ref (e.g. "v1.2.3") already carries the leading v, so it is
          # used verbatim in both the message and the release URL.
          VERSION: ${{ github.ref_name }}
          TWEET: |
            Pydantic AI Harness {version} is out! 🎉

            https://github.com/pydantic/pydantic-ai-harness/releases/tag/{version}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
